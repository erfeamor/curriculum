# Full local stack: database → migrations → domain service → BFF → metrics.
# Run from the cv-project root (requires the sibling repos to be present):
#
#   docker compose -f docker-compose.dev.yml up --build
#
# Then:
#   curl http://localhost:3000/api/v1/people/1   # BFF → domain service → MySQL
#   http://localhost:9090                        # Prometheus
#   http://localhost:3001                        # Grafana (admin/admin)
#
# Frontends are not containerized — run them with `npm run dev` in
# cv-admin-react (:5173) and cv-public-vanilla (:4173).

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cv
      MYSQL_USER: cv
      MYSQL_PASSWORD: cv
    ports:
      - "3306:3306"
    volumes:
      - cv-dev-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  flyway:
    image: flyway/flyway:10
    command: migrate
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./cv-database/sql:/flyway/sql:ro
    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/cv
      FLYWAY_USER: cv
      FLYWAY_PASSWORD: cv
      FLYWAY_LOCATIONS: filesystem:/flyway/sql/migrations,filesystem:/flyway/sql/dev-seeds
      FLYWAY_CONNECT_RETRIES: "30"

  domain-service:
    build: ./cv-domain-service
    depends_on:
      flyway:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cv
      SPRING_DATASOURCE_USERNAME: cv
      SPRING_DATASOURCE_PASSWORD: cv
      AUTH_ENABLED: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4173
    ports:
      - "8080:8080"

  bff:
    build: ./cv-bff-node
    depends_on:
      - domain-service
    environment:
      DOMAIN_SERVICE_URL: http://domain-service:8080
      CORS_ALLOWED_ORIGINS: http://localhost:4173
      AUTH_ENABLED: "false"
    ports:
      - "3000:3000"

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./devstack/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./cv-observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - cv-dev-grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"

volumes:
  cv-dev-mysql-data:
  cv-dev-grafana-data:
