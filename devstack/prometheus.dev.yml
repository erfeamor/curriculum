# Prometheus config for the docker-compose.dev.yml stack, where services are
# reachable by their compose service names (unlike cv-observability's
# standalone config, which scrapes across the host boundary).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: cv-domain-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["domain-service:8080"]

  - job_name: cv-bff-node
    metrics_path: /metrics
    static_configs:
      - targets: ["bff:3000"]
